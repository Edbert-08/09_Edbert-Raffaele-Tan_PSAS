<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041880.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">ElectroMart</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="content.html">Produk</a></li>
        <li class="nav-item"><a class="nav-link active" href="register.html">Pendaftaran</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 mb-5">
  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Form Pendaftaran Member</h2>

    <form>

      <div class="mb-3">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" placeholder="Masukkan nama">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Masukkan email">
      </div>

      <div class="mb-3">
        <label class="form-label">Jenis Kelamin</label><br>

        <input type="radio" name="gender"> Laki-laki
        <input type="radio" name="gender" class="ms-3"> Perempuan
      </div>

      <div class="mb-3">
        <label class="form-label">Pilih Produk Favorit</label><br>

        <input type="checkbox"> Laptop <br>
        <input type="checkbox"> Smartphone <br>
        <input type="checkbox"> Headset
      </div>

      <div class="mb-3">
        <label class="form-label">Kota</label>

        <select class="form-select">
          <option>Surabaya</option>
          <option>Jakarta</option>
          <option>Bandung</option>
          <option>Malang</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Daftar Sekarang
      </button>

    </form>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3">

</footer>


</body>
</html>
